[project]
name = "shaper"
version = "0.1.0"
description = "Transform unmanaged enterprise content into trusted, agent-ready knowledge"
readme = "README.md"
authors = [
    { name = "Steve Jeffery" }
]
requires-python = ">=3.11"
dependencies = [
    "azure-identity==1.24.0",
    "fastapi==0.116.1",
    "httpx==0.28.1",
    "mcp==1.13.1",
    "openai==1.99.9",
    "pydantic==2.11.7",
    "pydantic-settings==2.10.1",
    "psycopg[binary]==3.2.9",
    "pyjwt[crypto]==2.10.1",
    "pymupdf==1.26.3",
    "python-docx==1.2.0",
    "python-multipart==0.0.20",
    "structlog==25.4.0",
    "tqdm==4.67.1",
    "typer==0.16.0",
    "uvicorn==0.35.0",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
exclude-newer = "2026-08-09T00:00:00Z"

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[dependency-groups]
dev = [
    "hypothesis==6.137.1",
    "ipykernel==6.30.1",
    "ipywidgets==8.1.7",
    "mypy==1.17.1",
    "pytest==8.4.1",
    "pytest-cov==6.2.1",
    "pytest-mock==3.14.1",
    "ruff==0.12.8",
]

[project.scripts]
shaper = "shaper.interfaces.cli:main"
shaper-schema = "shaper.schema:main"

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -q"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["shaper"]
omit = [
    "*/shaper/application/ports.py",
    "*/shaper/interfaces/cli.py",
]

[tool.coverage.report]
fail_under = 75
show_missing = true

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["src/shaper", "tests"]

[[tool.mypy.overrides]]
module = ["pymupdf"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
"src/shaper/interfaces/http.py" = ["B008"]
